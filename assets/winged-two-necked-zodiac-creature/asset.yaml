id: winged-two-necked-zodiac-creature
title: Scorpio, winged creature with two necks
description: The creature standing for Scorpio on the zodiac wheel, a winged beast with two long necks rising from a feathered body, one ending in a beaked head at the top and the other looping down to the left; the broad wing spreads to the right and the tail ends in a red band and a cross-hatched tip. Tan parchment tone with brown ink. Transparent background.
