# descriptive: find it and understand it
id: wind-diagram-with-twelve-profile-heads
title: Rota of the winds with twelve heads
description: The complete wind diagram of the folio, a wheel whose broad green outer ring holds twelve roundels, each with a pale profile head blowing a green ray of breath toward the centre, with red quatrefoils between the roundels. Inscriptions in brown and red fill the ring and run along twelve red-ruled spokes from a small central disc through two inner concentric rings. The blank parchment inside the rings and outside the wheel is transparent.
