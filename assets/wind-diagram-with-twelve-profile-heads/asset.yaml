usage_notes:
  - The inscriptions, spokes and rings are part of the diagram and are kept; for a single blowing head use the wind-head assets, which are cut from this master and turned upright.
  - Blank parchment is transparent, so the counters of the lettering show whatever sits behind the wheel; it reads best on a light ground.
