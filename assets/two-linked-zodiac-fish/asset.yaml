id: two-linked-zodiac-fish
title: Pisces, two linked fish
description: The two fish of the zodiac wheel, one above the other and swimming in opposite directions, the upper fish heading right and the lower heading left. Both are mottled green over tan with brown fins, and a long brown cord runs from the mouth of the upper fish in a loop to the mouth of the lower one. Transparent background.
