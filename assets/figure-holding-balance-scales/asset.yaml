id: figure-holding-balance-scales
title: Libra, seated figure with scales
description: The Libra figure of the zodiac wheel, a seated person in a long pale robe with short curly hair, turned to the right with both arms extended to hold a balance whose beam tilts upward and carries a hanging pan at each end; one bare foot shows below the hem. Brown ink over parchment tone with light green shading. Transparent background.
