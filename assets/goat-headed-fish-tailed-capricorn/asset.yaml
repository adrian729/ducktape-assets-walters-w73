id: goat-headed-fish-tailed-capricorn
title: Capricorn, goat with fish tail
description: The Capricorn of the zodiac wheel, a goat with long curved horns, a bearded head and raised forelegs facing right, whose body ends at the left in a coiled fish tail with a mask-like knob at the tip. The body is tan with brown ink, the tail and belly are washed green, and a red band circles one foreleg. Transparent background.
