id: wind-head-03
title: Wind head 3, 2 o'clock
description: The profile head from the roundel at the 2 o'clock position of the wind rota, facing right with the mouth open and blowing. Hair in long brown strokes with red streaks, red lips around a green ray of breath blown to the right, a red cheek and a small crescent of neck below. Pale parchment-toned face drawn in brown ink. Transparent background.
